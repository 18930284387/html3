<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smiley Slots</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #spin-btn {
      background: linear-gradient(135deg, #ff4b2b, #ff416c);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 24px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
      transition: all 0.1s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      outline: none;
    }
    #spin-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 5px rgba(255, 65, 108, 0.4);
    }
    #spin-btn:disabled {
      background: #cccccc;
      color: #888888;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
  </style>
</head>
<body>
<!-- Please like <3 and share if you enjoyed! -->


<div class="container" onclick="startSpin()">
  <h1 class="title"> Smiley Sl😱ts </h1>
  <div class="money-container">
    <div id="money">100</div>
    <div class="changes"> </div>
  </div>

  <div class="play-area">
    <div class="reel-container"></div>
    <div class="reel-container"></div>
    <div class="reel-container"></div>
  </div>

  <div class="info">
    <div class="instructions">
      Press anywhere to spin the reels.<br/> Each spin costs 1 💰<br/> Match at least two on the middle row to win!<br/> See prizes below.</div>

    <div class="prize-table">
      <div class="doubles">
      </div>
      <div class="triples">

      </div>
    </div>
  <script src="script.js"></script>
</body>
</html>
