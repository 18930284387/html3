<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smiley Slots</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    .title {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #333;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    .money-container {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    #money {
      font-size: 2rem;
      font-weight: bold;
      color: #28a745;
    }

    .changes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .change {
      padding: 5px 10px;
      border-radius: 5px;
      font-weight: bold;
      animation: fadeIn 0.3s ease;
    }

    .change.negative {
      color: #dc3545;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .play-area {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .reel-container {
      width: 80px;
      height: 240px;
      border: 4px solid #333;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .reel-item {
      font-size: 3rem;
      padding: 10px;
      transition: all 0.1s ease;
      opacity: 0.3;
      transform: scale(0.8);
    }

    .reel-item.active {
      opacity: 1;
      transform: scale(1);
    }

    .reel-item.win {
      animation: pulse 0.5s infinite alternate;
    }

    .reel-item.deactivate {
      opacity: 0;
      transform: scale(0.8);
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.2); }
    }

    .spin-button {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
      color: white;
      border: none;
      padding: 18px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(238, 90, 82, 0.4);
      transition: all 0.3s ease;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .spin-button:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(238, 90, 82, 0.5);
    }

    .spin-button:active:not(:disabled) {
      transform: translateY(0);
    }

    .spin-button:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }

    .info {
      margin-top: 20px;
    }

    .instructions {
      background: #e9ecef;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      color: #555;
      line-height: 1.6;
    }

    .prize-table {
      display: flex;
      justify-content: space-around;
      gap: 20px;
    }

    .doubles, .triples {
      flex: 1;
      text-align: left;
    }

    .doubles h3, .triples h3 {
      color: #333;
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .prize-item {
      padding: 8px 12px;
      margin: 5px 0;
      background: #f8f9fa;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .prize-item.active {
      background: #ffc107;
      font-weight: bold;
      transform: scale(1.05);
    }
  </style>

</head>
<body>
<!-- Please like <3 and share if you enjoyed! -->


<div class="container">
  <h1 class="title"> Smiley Sl😱ts </h1>
  <div class="money-container">
    <div id="money">100</div>
    <div class="changes"> </div>
  </div>

  <div class="play-area">
    <div class="reel-container"></div>
    <div class="reel-container"></div>
    <div class="reel-container"></div>
  </div>

  <button id="spinButton" class="spin-button">Spin</button>

  <div class="info">
    <div class="instructions">
      Press the Spin button to play!<br/> Each spin costs 1 💰<br/> Match at least two on the middle row to win!<br/> See prizes below.</div>

    <div class="prize-table">
      <div class="doubles">
        <h3>Doubles</h3>
      </div>
      <div class="triples">
        <h3>Triples</h3>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
