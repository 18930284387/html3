<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smiley Slots</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .spin-button-container {
      display: flex;
      justify-content: center;
      margin: 20px 0 10px;
    }

    .spin-button {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 16px 36px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fff;
      background: linear-gradient(135deg, #ff4d6d 0%, #ff9f1c 100%);
      box-shadow: 0 14px 30px rgba(255, 77, 109, 0.35), 0 0 0 4px rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease, opacity 0.12s ease;
    }

    .spin-button:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 18px 34px rgba(255, 77, 109, 0.4), 0 0 0 6px rgba(255, 255, 255, 0.16);
      filter: brightness(1.05);
    }

    .spin-button:active:not(:disabled),
    .spin-button.is-pressed:not(:disabled) {
      transform: translateY(2px) scale(0.97);
      box-shadow: 0 8px 18px rgba(255, 77, 109, 0.3), 0 0 0 4px rgba(255, 255, 255, 0.12);
      filter: brightness(0.94);
    }

    .spin-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22), 0 0 0 4px rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
<!-- Please like <3 and share if you enjoyed! -->

<div class="container">
  <h1 class="title"> Smiley Sl😱ts </h1>
  <div class="money-container">
    <div id="money">100</div>
    <div class="changes"> </div>
  </div>

  <div class="play-area">
    <div class="reel-container"></div>
    <div class="reel-container"></div>
    <div class="reel-container"></div>
  </div>

  <div class="spin-button-container">
    <button id="spin-button" class="spin-button" type="button">🎰 SPIN NOW</button>
  </div>

  <div class="info">
    <div class="instructions">
      Press the SPIN button to start the reels.<br/> Each spin costs 1 💰<br/> Match at least two on the middle row to win!<br/> See prizes below.
    </div>

    <div class="prize-table">
      <div class="doubles">
      </div>
      <div class="triples">
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
