<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smiley Slots</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .pity-container {
      font-size: 1.5rem;
      margin: 1rem 0;
      padding: 0.5rem 1rem;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      display: inline-block;
    }
  </style>

</head>
<body>
<!-- Please like <3 and share if you enjoyed! -->


<div class="container" onclick="startSpin()">
  <h1 class="title"> Smiley Sl😱ts </h1>
  <div class="money-container">
    <div id="money">100</div>
    <div class="changes"> </div>
  </div>
  <div class="pity-container">
    Pity: <span id="pity-display">30</span>
  </div>

  <div class="play-area">
    <div class="reel-container"></div>
    <div class="reel-container"></div>
    <div class="reel-container"></div>
  </div>

  <div class="info">
    <div class="instructions">
      Press anywhere to spin the reels.<br/> Each spin costs 1 💰<br/> Match at least two on the middle row to win!<br/> See prizes below.</div>

    <div class="prize-table">
      <div class="doubles">
      </div>
      <div class="triples">

      </div>
    </div>
  <script src="script.js"></script>
</body>
</html>
